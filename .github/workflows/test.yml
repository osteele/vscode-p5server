name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Compile, lint, and unit test
        run: bun run test:quick

      - name: Integration test (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a bun run test:integration

      - name: Integration test (macOS)
        if: runner.os == 'macOS'
        run: bun run test:integration
